<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LMS host stand-in</title>
</head>
<body>
<!-- Stands in for an LMS page that embeds the SCO in an iframe; focus must never leave the iframe while a card is open. -->
<button id="lms-before">LMS before</button>
<iframe id="sco" title="Player" style="width: 820px; height: 720px; border: 0;"></iframe>
<button id="lms-after">LMS after</button>
<script>document.getElementById('sco').src = 'index.html' + location.search;</script>
</body>
</html>
